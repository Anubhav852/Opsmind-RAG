services:
  - type: web
    name: opsmind-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn opsmind.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PYTHONPATH
        value: "src"